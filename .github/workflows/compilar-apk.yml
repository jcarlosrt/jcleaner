name: Compilar APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5

      # La clave permanente vive en los secretos del repositorio (nunca en el código)
      - name: Preparar clave de firma
        id: clave
        env:
          CLAVE_B64: ${{ secrets.JCLEANER_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$CLAVE_B64" ]; then
            echo "$CLAVE_B64" | base64 -d > "$RUNNER_TEMP/jcleaner-firma.jks"
            echo "JCLEANER_KEYSTORE=$RUNNER_TEMP/jcleaner-firma.jks" >> "$GITHUB_ENV"
            echo "firmada=si" >> "$GITHUB_OUTPUT"
            echo "Se firmará con la clave permanente."
          else
            echo "firmada=no" >> "$GITHUB_OUTPUT"
            echo "::warning::No hay clave permanente cargada en los secretos: el APK se firma con la clave de prueba y no se publica en Releases."
          fi

      - name: Compilar
        env:
          JCLEANER_KEYSTORE_PASSWORD: ${{ secrets.JCLEANER_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Verificar firma y que no tenga permiso de internet
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | tail -1)
          APK=app/build/outputs/apk/release/app-release.apk
          $BT/aapt2 dump permissions $APK | tee permisos.txt
          if grep -q "android.permission.INTERNET" permisos.txt; then echo "ERROR: el APK pide internet"; exit 1; fi
          $BT/apksigner verify --print-certs $APK | grep -i "SHA-256" || true

      - name: Renombrar
        run: |
          cp app/build/outputs/apk/release/app-release.apk JCLEANER.apk
          cp app/build/outputs/bundle/release/app-release.aab JCLEANER-playstore.aab

      - uses: actions/upload-artifact@v5
        with:
          name: JCLEANER-apk
          path: |
            JCLEANER.apk
            JCLEANER-playstore.aab

      # Solo las versiones firmadas con la clave permanente se publican en Releases
      - name: Publicar en Releases
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.clave.outputs.firmada == 'si'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" JCLEANER.apk --clobber
          else
            gh release create "$TAG" JCLEANER.apk --title "JCLEANER $VERSION" \
              --notes "Descarga **JCLEANER.apk**, ábrelo en tu teléfono Android y permite la instalación. Código abierto bajo GPL-3.0."
          fi
