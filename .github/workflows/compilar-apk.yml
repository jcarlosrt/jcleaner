name: Compilar APK

on:
  push:
  workflow_dispatch:

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Renombrar
        run: cp app/build/outputs/apk/debug/app-debug.apk JCLEANER.apk

      - uses: actions/upload-artifact@v4
        with:
          name: JCLEANER-apk
          path: JCLEANER.apk
